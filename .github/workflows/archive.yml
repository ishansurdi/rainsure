# Save every 00z/12z ECMWF run (India tp, all members) to the `archive` release before ECMWF deletes it (~3 days).
# DECISIONS.md D20, D47, D61. Runs hourly; each run only fetches what is missing.
name: archive

on:
  schedule:
    # Hourly (D61): GitHub skipped most 3-hourly runs on 2026-11-05/06. Public repo, so Actions minutes are free;
    # a run with nothing new exits after the pending check and skips the site rebuild.
    # :23 avoids the top-of-hour load where GitHub delays/drops scheduled runs (GitHub docs).
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive.yml"
      - "ingest/**"
      - "process/**"
      - "store/**"
      - "common/**"
      - "frontend/**"
      - "requirements-pipeline.txt"

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pinned pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Make sure the archive release exists
        run: |
          gh release view archive > /dev/null 2>&1 || gh release create archive --title "Forecast archive" \
            --notes "Accumulated tp (mm) for India, all 50 members, 6-hourly steps, per 00z/12z run. Built by .github/workflows/archive.yml. ECMWF open data, CC BY 4.0."

      - name: Runner checks (packages, ecCodes, mirror timings) to the release
        run: |
          python -m ingest.runner_checks --out runner_checks.json
          gh release upload archive runner_checks.json --clobber  # latest only; readable without login
          { echo "## Runner checks"; echo '```json'; cat runner_checks.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive pending runs
        run: |
          gh release view archive --json assets --jq '.assets[].name' > existing.txt
          python -m ingest.archive_run --pending --existing existing.txt > pending.txt
          echo "Pending runs: $(tr '\n' ' ' < pending.txt)"
          failed=0
          for run in $(cat pending.txt); do
            rm -rf out
            set +e; python -m ingest.archive_run --run "$run" --out out 2>&1 | tee -a run.log; code=${PIPESTATUS[0]}; set -e
            if [ "$code" = "0" ]; then
              gh release upload archive out/*.json --clobber   # metadata first,
              gh release upload archive out/*.npz --clobber    # then the .npz that marks the run as done
            elif [ "$code" = "3" ]; then
              echo "::notice::$run not published yet (or expired); will retry next time"
            else
              echo "::error::$run failed (exit $code)"; failed=1
            fi
          done
          {
            echo "## Archive"
            echo "Pending: $(tr '\n' ' ' < pending.txt)"
            echo '```'
            grep -E "MB/s|not \(fully\)|ERROR|Error" run.log || echo "nothing archived"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $failed

  # Publish the newest complete archived run to Pages (DECISIONS.md D19, D52). Runs even if one archive run failed:
  # a bad run is never archived, so the previous good run keeps being served.
  publish:
    needs: archive
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # upload frontend_build.log to the release when the frontend build fails
      pages: write # deploy-pages README: required
      id-token: write # deploy-pages README: required
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to find the last commit that changed the site's code

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pinned pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      # Skip the rebuild on a scheduled run when the live site already shows the newest run, the same previous run
      # and was built from the same code (D61). Pushes and manual runs always rebuild.
      - name: Decide whether the site needs a rebuild
        id: decide
        run: |
          gh release view archive --json assets --jq '.assets[].name' > existing.txt
          read run prev < <(python -m store.publish --pick --existing existing.txt)
          sha=$(git log -1 --format=%H -- store process common frontend .github/workflows/archive.yml requirements-pipeline.txt)
          curl -sf --max-time 30 https://ishansurdi.github.io/rainsure/data/latest.json -o live.json || echo '{}' > live.json
          live=$(python -c "import json; m=json.load(open('live.json')); print(m.get('run_id'), m.get('previous_run_id') or '-', m.get('source_sha'))")
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$live" = "$run $prev $sha" ]; then skip=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "## Publish skipped: $run (previous $prev) is already live, built from ${sha:0:7}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build products
        if: steps.decide.outputs.skip != 'true'
        run: |
          run=${{ steps.decide.outputs.run }}; prev=${{ steps.decide.outputs.prev }}
          echo "Publishing $run (previous $prev)"
          gh release download archive -D dl -p "tp_*_${run}.*"
          if [ "$prev" != "-" ]; then gh release download archive -D dl -p "tp_*_${prev}.*"; fi
          python -m store.publish --archive-dir dl --run "$run" --prev "$prev" --site site --source-sha ${{ steps.decide.outputs.sha }}
          {
            echo "## Published $run (previous $prev)"
            echo '```'
            for d in "site/data/$run/points" "site/data/$run/layers" site; do du -sh "$d"; done  # one call each: du counts a folder once
            echo "tiles: $(ls site/data/$run/points | wc -l)"
            echo "largest tile: $(ls -S site/data/$run/points | head -1) $(ls -lS site/data/$run/points | sed -n 2p | awk '{print $5}') bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        if: steps.decide.outputs.skip != 'true'
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build the frontend next to the data
        if: steps.decide.outputs.skip != 'true'
        run: |
          set -o pipefail
          # on failure the log goes to the release as frontend_build.log, readable without a GitHub login
          if ! { npm ci --prefix frontend --no-fund --no-audit && npm --prefix frontend test && npm --prefix frontend run build; } 2>&1 | tee frontend_build.log; then
            gh release upload archive frontend_build.log --clobber; exit 1
          fi
          cp -r frontend/dist/. site/
          { echo "## Frontend"; echo '```'; du -sh frontend/dist; ls -l frontend/dist/assets | awk '{print $5, $9}'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        if: steps.decide.outputs.skip != 'true'
        with:
          path: site

      - id: deployment
        if: steps.decide.outputs.skip != 'true'
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000 # ms; the default 10 min ran out on 2026-11-06 while Pages processed ~1,000 files
