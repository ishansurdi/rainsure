# Save every 00z/12z ECMWF run (India tp, all members) to the `archive` release before ECMWF deletes it (~3 days).
# DECISIONS.md D20, D47. Runs every 3 h; each run only fetches what is missing.
name: archive

on:
  schedule:
    - cron: "23 */3 * * *" # :23 avoids the top-of-hour load where GitHub delays/drops scheduled runs (GitHub docs)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive.yml"
      - "ingest/**"
      - "common/**"
      - "requirements-pipeline.txt"

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pinned pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Make sure the archive release exists
        run: |
          gh release view archive > /dev/null 2>&1 || gh release create archive --title "Forecast archive" \
            --notes "Accumulated tp (mm) for India, all 50 members, 6-hourly steps, per 00z/12z run. Built by .github/workflows/archive.yml. ECMWF open data, CC BY 4.0."

      - name: Runner checks (packages, ecCodes, mirror timings) to the release
        run: |
          python -m ingest.runner_checks --out runner_checks.json
          gh release upload archive runner_checks.json --clobber  # latest only; readable without login
          { echo "## Runner checks"; echo '```json'; cat runner_checks.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive pending runs
        run: |
          gh release view archive --json assets --jq '.assets[].name' > existing.txt
          python -m ingest.archive_run --pending --existing existing.txt > pending.txt
          echo "Pending runs: $(tr '\n' ' ' < pending.txt)"
          failed=0
          for run in $(cat pending.txt); do
            rm -rf out
            set +e; python -m ingest.archive_run --run "$run" --out out 2>&1 | tee -a run.log; code=${PIPESTATUS[0]}; set -e
            if [ "$code" = "0" ]; then
              gh release upload archive out/*.json --clobber   # metadata first,
              gh release upload archive out/*.npz --clobber    # then the .npz that marks the run as done
            elif [ "$code" = "3" ]; then
              echo "::notice::$run not published yet (or expired); will retry next time"
            else
              echo "::error::$run failed (exit $code)"; failed=1
            fi
          done
          {
            echo "## Archive"
            echo "Pending: $(tr '\n' ' ' < pending.txt)"
            echo '```'
            grep -E "MB/s|not \(fully\)|ERROR|Error" run.log || echo "nothing archived"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $failed
