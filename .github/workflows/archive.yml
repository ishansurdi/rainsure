# Save every 00z/12z ECMWF run (India tp, all members) to the `archive` release before ECMWF deletes it (~3 days).
# DECISIONS.md D20, D47. Runs every 3 h; each run only fetches what is missing.
name: archive

on:
  schedule:
    - cron: "23 */3 * * *" # :23 avoids the top-of-hour load where GitHub delays/drops scheduled runs (GitHub docs)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive.yml"
      - "ingest/**"
      - "process/**"
      - "store/**"
      - "common/**"
      - "frontend/**"
      - "requirements-pipeline.txt"

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pinned pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Make sure the archive release exists
        run: |
          gh release view archive > /dev/null 2>&1 || gh release create archive --title "Forecast archive" \
            --notes "Accumulated tp (mm) for India, all 50 members, 6-hourly steps, per 00z/12z run. Built by .github/workflows/archive.yml. ECMWF open data, CC BY 4.0."

      - name: Runner checks (packages, ecCodes, mirror timings) to the release
        run: |
          python -m ingest.runner_checks --out runner_checks.json
          gh release upload archive runner_checks.json --clobber  # latest only; readable without login
          { echo "## Runner checks"; echo '```json'; cat runner_checks.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive pending runs
        run: |
          gh release view archive --json assets --jq '.assets[].name' > existing.txt
          python -m ingest.archive_run --pending --existing existing.txt > pending.txt
          echo "Pending runs: $(tr '\n' ' ' < pending.txt)"
          failed=0
          for run in $(cat pending.txt); do
            rm -rf out
            set +e; python -m ingest.archive_run --run "$run" --out out 2>&1 | tee -a run.log; code=${PIPESTATUS[0]}; set -e
            if [ "$code" = "0" ]; then
              gh release upload archive out/*.json --clobber   # metadata first,
              gh release upload archive out/*.npz --clobber    # then the .npz that marks the run as done
            elif [ "$code" = "3" ]; then
              echo "::notice::$run not published yet (or expired); will retry next time"
            else
              echo "::error::$run failed (exit $code)"; failed=1
            fi
          done
          {
            echo "## Archive"
            echo "Pending: $(tr '\n' ' ' < pending.txt)"
            echo '```'
            grep -E "MB/s|not \(fully\)|ERROR|Error" run.log || echo "nothing archived"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $failed

  # Publish the newest complete archived run to Pages (DECISIONS.md D19, D52). Runs even if one archive run failed:
  # a bad run is never archived, so the previous good run keeps being served.
  publish:
    needs: archive
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write # deploy-pages README: required
      id-token: write # deploy-pages README: required
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pinned pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Pick runs and build products
        run: |
          gh release view archive --json assets --jq '.assets[].name' > existing.txt
          read run prev < <(python -m store.publish --pick --existing existing.txt)
          echo "Publishing $run (previous $prev)"
          gh release download archive -D dl -p "tp_*_${run}.*"
          if [ "$prev" != "-" ]; then gh release download archive -D dl -p "tp_*_${prev}.*"; fi
          python -m store.publish --archive-dir dl --run "$run" --prev "$prev" --site site
          {
            echo "## Published $run (previous $prev)"
            echo '```'
            for d in "site/data/$run/points" "site/data/$run/layers" site; do du -sh "$d"; done  # one call each: du counts a folder once
            echo "tiles: $(ls site/data/$run/points | wc -l)"
            echo "largest tile: $(ls -S site/data/$run/points | head -1) $(ls -lS site/data/$run/points | sed -n 2p | awk '{print $5}') bytes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build the frontend next to the data
        run: |
          npm ci --prefix frontend --no-fund --no-audit
          npm --prefix frontend test
          npm --prefix frontend run build
          cp -r frontend/dist/. site/
          { echo "## Frontend"; echo '```'; du -sh frontend/dist; ls -l frontend/dist/assets | awk '{print $5, $9}'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
